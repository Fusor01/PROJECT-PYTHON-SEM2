<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mail Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 500px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { color: white; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            background: #fff;
            color: #764ba2;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); background: #f0f0f0; }
        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            color: white;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mail Detector</h1>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Paste your email content here..." required>{{text}}</textarea>
            <br>
            <button type="submit">Analyze Message</button>
        </form>

        {% if prediction %}
        <div class="result" style="background-color: {{color}};">
            The message is: {{prediction}}
        </div>
        {% endif %}
    </div>
</body>
</html>
